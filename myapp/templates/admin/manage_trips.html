<!DOCTYPE html>
<html>
<head>
    <title>Manage Trips</title>
    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:20px;
        }

        h2{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }

        th{
            background:#0d6efd;
            color:white;
        }

        img{
            width:100px;
            height:70px;
            object-fit:cover;
            border-radius:5px;
        }

        .edit{
            background:orange;
            color:white;
            padding:6px 12px;
            text-decoration:none;
            border-radius:5px;
        }

        .delete{
            background:red;
            color:white;
            padding:6px 12px;
            text-decoration:none;
            border-radius:5px;
        }

        .add{
            background:green;
            color:white;
            padding:10px 15px;
            text-decoration:none;
            border-radius:5px;
            float:right;
            margin-bottom:20px;
        }
    </style>
</head>
<body>

<a href="{% url 'admin_dashboard' %}"
   style="
      display:inline-block;
      margin-bottom:20px;
      padding:10px 18px;
      background:#0d6efd;
      color:white;
      text-decoration:none;
      border-radius:6px;">
    ← Back to Dashboard
</a>

<h2>Manage Trips</h2>

<a href="/admin/myapp/trip/add/" class="add">+ Add New Trip</a>

<table>
<tr>
    <th>Image</th>
    <th>Place</th>
    <th>State</th>
    <th>Price</th>
    <th>Duration</th>
    <th>Action</th>
</tr>

{% for trip in trips %}
<tr>

<td>
<img src="{{ trip.image.url }}">
</td>

<td>{{ trip.place_name }}</td>

<td>{{ trip.state_or_country }}</td>

<td>₹{{ trip.price }}</td>

<td>{{ trip.duration }}</td>

<td>
<a href="{% url 'edit_trip' trip.id %}" class="edit">Edit</a>

<a href="{% url 'delete_trip' trip.id %}" class="delete"
onclick="return confirm('Delete this trip?')">Delete</a>
</td>

</tr>
{% endfor %}

</table>

</body>
</html>
