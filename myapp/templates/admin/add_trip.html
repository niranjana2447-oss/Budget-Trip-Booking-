<!DOCTYPE html>
<html>
<head>
    <title>Add New Trip</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f6f9;
        }

        .container{
            width:60%;
            margin:30px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#0d6efd;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            background:#0d6efd;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0b5ed7;
        }
    </style>
</head>

<body>

<div class="container">

<a href="{% url 'admin_dashboard' %}"
   style="
      display:inline-block;
      margin-bottom:20px;
      padding:10px 18px;
      background:#0d6efd;
      color:white;
      text-decoration:none;
      border-radius:6px;">
    ← Back to Dashboard
</a>

<h2>Add New Trip</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="text" name="place_name" placeholder="Place Name" required>

    <input type="text" name="state_or_country" placeholder="State / Country" required>

    <input type="number" name="price" placeholder="Price" required>

    <input type="text" name="duration" placeholder="Duration" required>

    <input type="text" name="best_time" placeholder="Best Time" required>

    <input type="text" name="places_covered" placeholder="Places Covered" required>

    <textarea name="description" placeholder="Description" rows="5"></textarea>

    <input type="file" name="image">

    <button type="submit">Add Trip</button>

</form>

</div>

</body>
</html>
