<!DOCTYPE html>
<html>
<head>
    <title>Book Trip</title>
    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .container{
            width:500px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        h2{
            color:#0d6efd;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Book {{ trip.place_name }}</h2>

<p><b>Price per Person:</b> ₹{{ trip.price }}</p>

<form method="POST">

{% csrf_token %}

<input type="text" name="name" placeholder="Full Name" required>

<input type="email" name="email" placeholder="Email" required>

<input type="text" name="phone" placeholder="Phone Number" required>

<input type="number" name="persons" placeholder="Number of Persons" required>

<input type="date" name="travel_date" required>

<button type="submit">Proceed to Payment</button>

</form>

</div>

</body>
</html>
