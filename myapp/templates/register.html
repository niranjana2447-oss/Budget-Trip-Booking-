<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Budget Trip Booking</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ecf0f1; }
    .container { width: 350px; margin: 80px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2c3e50; }
    input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1e8449; }
    .links { text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Create Account</h2>
    <form method="POST">
      {% csrf_token %}
      <input type="text" name="Fullname" placeholder="Fullname" required>
      <input type="email" name="Email" placeholder="Email" required>
      <input type="password" name="Password" placeholder="Password" required>
      <input type="password" name="Confirm_password" placeholder="Confirm Password" required>
      <button type="submit">Register</button>
    </form>
    <div class="links">
      <p>Already have an account? <a href="{% url 'login' %}">Sign In</a></p>
    </div>
  </div>
</body>
</html>
